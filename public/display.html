<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Proyección - Sanación Sin Límites</title>
  <link rel="stylesheet" href="/css/display.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-cinematic font-size-medium">
  <!-- Blackout Overlay -->
  <div id="blackout-layer" class="blackout-layer"></div>

  <!-- Background Layer (Video / Motion para letras) -->
  <div id="background-layer" class="background-layer">
    <video id="bg-video" class="bg-video" loop muted playsinline></video>
    <div id="bg-ambient" class="bg-ambient"></div>
    <div class="bg-overlay"></div>
  </div>

  <!-- Content Layer (Lyrics) -->
  <main id="content-layer" class="content-layer">
    <div id="slide-container" class="slide-container">
      <div id="slide-text" class="slide-text"></div>
    </div>
  </main>

  <!-- Program Image Layer (Fotos, flyers, anuncios) -->
  <div id="program-image-container" class="program-image-container hidden">
    <img id="program-image" class="program-image" src="" alt="Proyección de Programa">
  </div>

  <!-- Bible Scripture Layer -->
  <div id="bible-container" class="bible-container hidden">
    <div class="bible-card">
      <p id="bible-text" class="bible-text"></p>
      <div class="bible-ref-container">
        <span id="bible-reference" class="bible-reference"></span>
        <span id="bible-version-tag" class="bible-version-tag"></span>
      </div>
    </div>
  </div>

  <!-- Countdown Timer Layer -->
  <div id="countdown-container" class="countdown-container hidden">
    <div class="countdown-card">
      <h2 id="countdown-title" class="countdown-title">EL SERVICIO COMIENZA EN</h2>
      <div id="countdown-digits" class="countdown-digits">05:00</div>
      <div id="countdown-end-msg" class="countdown-end-msg hidden">¡BIENVENIDOS!</div>
    </div>
  </div>

  <!-- Foreground Video Layer (Video completo con audio sin letras) -->
  <div id="fg-video-container" class="fg-video-container hidden">
    <video id="fg-video" class="fg-video" playsinline></video>
  </div>

  <!-- Audio unlock notice if needed -->
  <div id="audio-unlock-banner" class="audio-unlock-banner hidden">
    <span>🔊 Haz clic aquí para activar el audio del proyector</span>
  </div>

  <!-- Controls overlay (auto-hides) -->
  <div id="hud-bar" class="hud-bar">
    <span class="hud-badge" id="hud-status">PROYECCIÓN ACTIVA</span>
    <button id="btn-fullscreen" class="hud-btn" title="Pantalla Completa (F11)">⛶ Pantalla Completa</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/display.js"></script>
</body>
</html>
